[project]
name = "ingestion-pipeline"
version = "1.0.0"
description = "Restartable, observable API data ingestion pipeline (orders + order events) with a local mock API."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Vinayaka G C" }]
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0.30,<2.1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
ingest = "ingestion_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a real PostgreSQL database (TEST_DATABASE_URL)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["ingestion_pipeline"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S101",  # assert is fine in tests
    "S311",  # random is used for synthetic data / jitter, not cryptography
    "S608",  # SQL built only from internal constants, values are always bound parameters
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/versions/**" = ["E501"]
